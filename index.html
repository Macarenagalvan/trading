<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Checklist · Maca Trading</title>
<meta name="theme-color" content="#0d0f12">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<style>
  @import url('https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700&family=Roboto+Mono:wght@400;500;600&display=swap');
  :root {
    --bg: #0d0f12;
    --bg2: #13161a;
    --bg3: #1a1e24;
    --border: #2a313b;
    --text: #e8edf2;
    --text2: #8a97a8;
    --text3: #556070;
    --accent: #4f9cf9;
    --green: #3ecf8e;
    --red: #f05252;
    --pink: #f472b6;
    --amber: #f59e0b;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    background: var(--bg);
    color: var(--text);
    font-family: 'Outfit', sans-serif;
    font-size: 15px;
    min-height: 100vh;
    padding: 16px;
    padding-bottom: 40px;
  }
  h1 {
    font-size: 18px;
    font-weight: 700;
    margin-bottom: 4px;
  }
  .sub {
    font-size: 11px;
    color: var(--text3);
    font-family: 'Roboto Mono', monospace;
    margin-bottom: 20px;
    letter-spacing: .05em;
  }
  .strats {
    display: flex;
    flex-wrap: wrap;
    gap: 8px;
    margin-bottom: 20px;
  }
  .strat-btn {
    padding: 8px 16px;
    border-radius: 20px;
    border: 1px solid var(--border);
    background: var(--bg3);
    color: var(--text2);
    font-size: 13px;
    font-weight: 500;
    cursor: pointer;
    font-family: 'Outfit', sans-serif;
    transition: all .15s;
  }
  .strat-btn.on-blue { background: #0f2a4a; border-color: #4f9cf9; color: #4f9cf9; }
  .strat-btn.on-red { background: #3d1212; border-color: #f05252; color: #f05252; }
  .strat-btn.on-pink { background: #3d1030; border-color: #f472b6; color: #f472b6; }
  .strat-btn.on-white { background: #2a2f36; border-color: #c0c9d4; color: #c0c9d4; }
  .strat-btn.on-black { background: #1a1e24; border-color: #e8edf2; color: #e8edf2; }
  .strat-btn.on-green { background: #0d2a1a; border-color: #3ecf8e; color: #3ecf8e; }

  .panel {
    background: var(--bg2);
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 16px;
    display: none;
  }
  .panel.visible { display: block; }
  .panel-title {
    font-size: 11px;
    font-weight: 600;
    letter-spacing: .12em;
    text-transform: uppercase;
    color: var(--text3);
    font-family: 'Roboto Mono', monospace;
    margin-bottom: 14px;
  }
  .item {
    display: flex;
    align-items: flex-start;
    gap: 12px;
    padding: 10px 0;
    border-bottom: 1px solid var(--border);
    cursor: pointer;
    user-select: none;
  }
  .item:last-of-type { border-bottom: none; }
  .item input {
    margin-top: 3px;
    width: 18px;
    height: 18px;
    accent-color: var(--accent);
    flex-shrink: 0;
    cursor: pointer;
  }
  .item span {
    font-size: 14px;
    color: var(--text2);
    line-height: 1.45;
  }
  .item.checked span {
    color: var(--text);
  }
  .score {
    margin-top: 16px;
    padding-top: 14px;
    border-top: 1px solid var(--border);
    display: flex;
    justify-content: space-between;
    align-items: center;
  }
  .score-num {
    font-family: 'Roboto Mono', monospace;
    font-size: 15px;
    font-weight: 600;
    color: var(--accent);
  }
  .copy-btn {
    padding: 8px 14px;
    background: var(--accent);
    border: none;
    border-radius: 8px;
    color: #fff;
    font-size: 13px;
    font-weight: 600;
    cursor: pointer;
    font-family: 'Outfit', sans-serif;
  }
  .copy-btn:active { transform: scale(0.97); }
  .toast {
    position: fixed;
    bottom: 24px;
    left: 50%;
    transform: translateX(-50%);
    background: var(--green);
    color: #0d0f12;
    padding: 10px 18px;
    border-radius: 8px;
    font-size: 13px;
    font-weight: 600;
    opacity: 0;
    transition: opacity .25s;
    pointer-events: none;
    z-index: 100;
  }
  .toast.show { opacity: 1; }
  .reset-btn {
    margin-top: 12px;
    width: 100%;
    padding: 10px;
    background: transparent;
    border: 1px solid var(--border);
    border-radius: 8px;
    color: var(--text3);
    font-size: 12px;
    cursor: pointer;
    font-family: 'Outfit', sans-serif;
  }
</style>
</head>
<body>

<h1>Checklist Must-have</h1>
<div class="sub">Elegí estrategia → marcá → copiá el score al journal</div>

<div class="strats">
  <button class="strat-btn" onclick="show('Blue', this)">Blue</button>
  <button class="strat-btn" onclick="show('Red', this)">Red</button>
  <button class="strat-btn" onclick="show('Pink', this)">Pink</button>
  <button class="strat-btn" onclick="show('White', this)">White</button>
  <button class="strat-btn" onclick="show('Black', this)">Black</button>
  <button class="strat-btn" onclick="show('Green', this)">Green</button>
</div>

<div class="panel" id="panel">
  <div class="panel-title" id="panel-title">Must-have</div>
  <div id="items"></div>
  <div class="score">
    <span class="score-num" id="score">0 / 0</span>
    <button class="copy-btn" onclick="copyScore()">Copiar score</button>
  </div>
  <button class="reset-btn" onclick="resetChecks()">Limpiar checks</button>
</div>

<div class="toast" id="toast">Score copiado</div>

<script>
const LISTS = {
  Blue: [
    "Zona soporte/resistencia + desaceleración",
    "Giro agresivo (Morning/Evening Star o Envolvente) — si no hay, se invalida",
    "Ruptura de estructura + EMA50 1H con RCC",
    "Pullback 0.38–0.50 a la EMA50 1H (sin confirmar ruptura en el pullback)",
    "Diagonal limpia (mín. 3 toques) o EMA50 5m + RCC",
    "RR ≥ 2R"
  ],
  Red: [
    "Zona soporte/resistencia + envolvente con mucha fuerza — si no hay, se invalida",
    "Ruptura EMA50 4H + estructura con RCC",
    "Pullback 0.30–0.50 hasta cruce de EMAs (sin romper EMA 1H con fuerza)",
    "Diagonal limpia + RCC",
    "RR ≥ 2R"
  ],
  Pink: [
    "Ruptura de zona S/R en diario + retest (1-2 velitas)",
    "Ruptura EMA50 4H + estructura con RCC",
    "Pullback que respeta la EMA50 4H (0.30–0.50)",
    "Patrón en 1H (cuña / triángulo / canal) + diagonal limpia + RCC",
    "RR ≥ 2R"
  ],
  White: [
    "Vengo de una Pink (ejecutada o solo el movimiento se dio)",
    "Impulso fuerte + pullback a EMA50 1H (0.38–0.50)",
    "RCC de la EMA50 1H",
    "Diagonal limpia + RCC",
    "RR ≥ 2R"
  ],
  Black: [
    "Zona S/R diaria muy importante (mín. 3 toques)",
    "Consolidación / patrón (cuña-triángulo-canal) con ≥ 2/3 relleno",
    "EMA50 1H fuera del patrón + no la tocó más de 2 veces recientemente",
    "Diagonal limpia + RCC",
    "RR ≥ 2R (ideal ≥ 3R)"
  ],
  Green: [
    "Movimiento impulsivo fuerte + pullback lento a zona S/R importante",
    "Patrón (cuña / triángulo / canal) con mín. 3 toques y ≥ 60% relleno",
    "Diagonal limpia en temporalidad pequeña + RCC",
    "RR ≥ 2R"
  ]
};

let current = '';

function show(name, btn) {
  current = name;
  document.querySelectorAll('.strat-btn').forEach(b => {
    b.className = 'strat-btn';
  });
  const colors = { Blue: 'on-blue', Red: 'on-red', Pink: 'on-pink', White: 'on-white', Black: 'on-black', Green: 'on-green' };
  btn.classList.add(colors[name]);

  const list = LISTS[name];
  document.getElementById('panel-title').textContent = name + ' · Must-have';
  document.getElementById('items').innerHTML = list.map((t, i) => `
    <label class="item" id="item-${i}">
      <input type="checkbox" onchange="updateScore()">
      <span>${t}</span>
    </label>
  `).join('');
  document.getElementById('panel').classList.add('visible');
  updateScore();
}

function updateScore() {
  const checks = document.querySelectorAll('#items input[type=checkbox]');
  let done = 0;
  checks.forEach((c, i) => {
    const item = document.getElementById('item-' + i);
    if (c.checked) {
      done++;
      item.classList.add('checked');
    } else {
      item.classList.remove('checked');
    }
  });
  document.getElementById('score').textContent = done + ' / ' + checks.length;
  window._lastScore = current + ' · Score: ' + done + '/' + checks.length;
}

function copyScore() {
  const text = window._lastScore || '';
  if (!text) return;
  navigator.clipboard.writeText(text).then(() => {
    const t = document.getElementById('toast');
    t.classList.add('show');
    setTimeout(() => t.classList.remove('show'), 1800);
  }).catch(() => {
    prompt('Copiá esto:', text);
  });
}

function resetChecks() {
  document.querySelectorAll('#items input[type=checkbox]').forEach(c => c.checked = false);
  updateScore();
}
</script>
</body>
</html>
